# NOTE: written but not yet executed on GitHub. The privileged kernel tests cannot run on
# hosted runners; they are run by hand on a Linux VM (see CLAUDE.md).
name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  EBPF_NIGHTLY: nightly-2026-11-17
  # Prebuilt release (cargo install needs llvm-config); hash is of the file as downloaded.
  BPF_LINKER_SHA256: 0e9b2b30f68898177f1cb6f0ecbfa909a82479473a49a0ef66529fd088e3e410

jobs:
  userspace:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install eBPF toolchain
        run: |
          rustup toolchain install "$EBPF_NIGHTLY" --component rust-src
          BL=bpf-linker-x86_64-unknown-linux-musl.tar.zst
          curl -fsSLO "https://github.com/aya-rs/bpf-linker/releases/download/v0.13.0/$BL"
          echo "$BPF_LINKER_SHA256  $BL" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar --zstd -xf "$BL" -C "$HOME/.local/bin" bpf-linker
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: GUI system libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - name: Rule pack benchmark (release)
        run: cargo test -p witness-rules --release --test bench -- --ignored --nocapture

  package:
    runs-on: ubuntu-22.04
    needs: userspace
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          rustup toolchain install "$EBPF_NIGHTLY" --component rust-src
          BL=bpf-linker-x86_64-unknown-linux-musl.tar.zst
          curl -fsSLO "https://github.com/aya-rs/bpf-linker/releases/download/v0.13.0/$BL"
          echo "$BPF_LINKER_SHA256  $BL" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar --zstd -xf "$BL" -C "$HOME/.local/bin" bpf-linker
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
      - run: cargo build --release -p witnessd -p witness-cli -p witness-gui
      - run: packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: debs
          path: dist/*.deb
