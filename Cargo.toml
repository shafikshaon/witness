[workspace]
resolver = "2"
exclude = ["witness-ebpf"]
members = ["witness-common", "witness-store", "witness-config", "witness-rules", "witnessd", "witness-cli"]
# witness-ebpf is a separate workspace (nightly, bpfel-unknown-none); see docs/DESIGN.md §1.2.

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
