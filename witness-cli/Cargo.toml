[package]
name = "witness-cli"
description = "The `witness` command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"

[[bin]]
name = "witness"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.8", features = ["derive"] }
serde_json = "=1.0.154"
witness-config = { path = "../witness-config" }
witness-store = { path = "../witness-store" }

[dev-dependencies]
tempfile = "=3.27.0"
