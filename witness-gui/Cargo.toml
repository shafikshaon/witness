[package]
name = "witness-gui"
description = "Desktop viewer for Witness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"

[[bin]]
name = "witness-gui"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["desktop", "macro", "hooks", "html", "signals", "launch"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "time"] }
witness-client = { path = "../witness-client" }

[dev-dependencies]
tempfile = "=3.27.0"
