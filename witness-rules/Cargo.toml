[package]
name = "witness-rules"
description = "Rule language, compiler and correlation engine for Witness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[dependencies]
globset = "=0.4.19"
regex = "=1.13.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_yaml_ng = "=0.10.0"
sha2 = "=0.11.0"
thiserror = "=2.0.21"
witness-common = { path = "../witness-common", features = ["schema"] }

[dev-dependencies]
tempfile = "=3.27.0"
