[package]
name = "witness-store"
description = "Tamper-evident segment storage, hash chain and verification for Witness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
