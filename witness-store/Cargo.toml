[package]
name = "witness-store"
description = "Tamper-evident segment storage, hash chain and verification for Witness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[dependencies]
getrandom = "=0.4.3"
hmac = "=0.13.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.0"
thiserror = "=2.0.21"
zeroize = { version = "=1.9.2", features = ["derive"] }
zstd = "=0.14.4"

[dev-dependencies]
tempfile = "=3.27.0"
