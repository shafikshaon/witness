[package]
name = "witnessd"
description = "Witness collector daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
build = "build.rs"

[lib]
name = "witnessd"
path = "src/lib.rs"

[[bin]]
name = "witnessd"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.8", features = ["derive"] }
rustix = { version = "=1.1.6", features = ["event", "time", "fs", "process"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
witness-common = { path = "../witness-common", features = ["schema"] }

[target.'cfg(target_os = "linux")'.dependencies]
aya = "=0.16.0"

[build-dependencies]
anyhow = "=1.0.104"
aya-build = "=0.2.1"

[dev-dependencies]
tempfile = "=3.27.0"
